<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أسماء المقبولين — الدراسة الصباحية | كلية علوم الحاسوب والرياضيات</title>
<meta name="description" content="قائمة أسماء الطلبة المقبولين في الدراسة الصباحية — كلية علوم الحاسوب والرياضيات، جامعة الموصل">
<meta name="theme-color" content="#f5f7fc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fc; --card:#ffffff; --ink:#1d2140; --muted:#6b7090;
    --brand:#232260; --accent:#3b4bc8; --line:#e4e8f3; --soft:#eef1fb;
    --hl:#fff1b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',system-ui,sans-serif;font-weight:400;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.7}
  .top{position:sticky;top:0;z-index:10;box-shadow:0 4px 16px rgba(35,34,96,.12)}
  header{background:linear-gradient(135deg,#232260 0%,#2f2e7e 100%);color:#fff;padding:12px 16px 14px;text-align:center}
  header .logo{display:block;margin:0 auto 6px;width:78px;height:78px;object-fit:cover;background:#fff;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
  h1{font-weight:500;font-size:1.45rem;color:#fff}
  h2{font-weight:400;font-size:1.08rem;color:#e3e5ff;margin-top:2px}
  .sub{display:inline-block;margin-top:6px;padding:2px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:.9rem}
  main{max-width:880px;margin:0 auto;padding:18px 14px 40px}
  .search{background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line)}
  .search .box{max-width:880px;margin:0 auto}
  .box{position:relative}
  .box input{width:100%;font-family:inherit;font-size:1.05rem;padding:14px 46px 14px 44px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none;box-shadow:0 2px 10px rgba(35,34,96,.05);transition:border-color .2s,box-shadow .2s}
  .box input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(59,75,200,.12)}
  .box .ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .box button{position:absolute;left:10px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;display:none}
  .box button.show{display:block}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{font-family:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip span{color:var(--muted);margin-inline-start:4px}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip.on span{color:#c9cdf5}
  .count{color:var(--muted);font-size:.92rem;margin:6px 2px 10px}
  .wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 14px rgba(35,34,96,.05)}
  table{width:100%;border-collapse:collapse}
  thead th{background:var(--brand);color:#fff;font-weight:500;text-align:right;padding:12px 14px;font-size:.98rem}
  th.n,td.n{width:56px;text-align:center}
  tbody td{padding:11px 14px;border-top:1px solid var(--line);font-size:1rem}
  tbody tr:nth-child(even) td{background:#fafbfe}
  tbody tr:hover td{background:var(--soft)}
  td.n{color:var(--muted)}
  td.d{color:var(--accent)}
  td.nm{white-space:nowrap}
  td.d{font-size:.9em;white-space:nowrap}

  tr.grp td{background:var(--soft)!important;color:var(--brand);font-weight:500;padding:9px 14px;font-size:.95rem}
  tr.grp td span{color:var(--muted);font-weight:400;margin-inline-start:6px}
  mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
  .empty{padding:36px 14px;text-align:center;color:var(--muted);display:none}
  footer{text-align:center;color:var(--muted);font-size:.9rem;padding:18px 10px 28px;letter-spacing:.3px}
  footer b{color:var(--brand);font-weight:500}
  @media (max-width:560px){
    header{padding:8px 12px 10px}
    header .logo{width:56px;height:56px;margin-bottom:4px}
    h1{font-size:1.08rem} h2{font-size:.92rem} .sub{font-size:.78rem;padding:1px 10px;margin-top:4px}
    .box input{padding:11px 42px 11px 40px;font-size:1rem}
    main{padding-left:8px;padding-right:8px}
    tbody td,thead th{padding:9px 6px;font-size:clamp(.62rem,3.3vw,.9rem)}
    td.d{font-size:clamp(.52rem,2.6vw,.8rem)}
    th.n,td.n{width:40px}
  }
</style>
</head>

// ترتيب الأقسام كما في ملف الإكسل
const DEPTS = [];
const counts = {};
DATA.forEach(([, d]) => { if (!(d in counts)) { counts[d] = 0; DEPTS.push(d); } counts[d]++; });

// توحيد الحروف العربية للبحث (أ إ آ ا، ة ه، ى ي، إزالة التشكيل والمسافات الزائدة)
const norm = s => s.replace(/[ً-ْـ]/g, '')
  .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
  .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/\s+/g, ' ').trim();

const ROWS = DATA.map(([n, d], i) => ({ i: i + 1, n, d, k: norm(n) }));

const tb = document.getElementById('tb'), q = document.getElementById('q'),
      clr = document.getElementById('clr'),
      empty = document.getElementById('empty');
let dept = '';

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// تظليل جزء الاسم المطابق
function highlight(name, nq) {
  if (!nq) return esc(name);
  // نبني خريطة من الاسم الأصلي إلى النسخة الموحدة حرفاً بحرف
  let map = [], k = '';
  for (let j = 0; j < name.length; j++) {
    const c = norm(name[j]) || (name[j] === ' ' ? ' ' : '');
    if (c === ' ' && k.endsWith(' ')) continue;
    for (const ch of c) { map.push(j); k += ch; }
  }
  const pos = k.indexOf(nq);
  if (pos < 0) return esc(name);
  const a = map[pos], b = map[pos + nq.length - 1] + 1;
  return esc(name.slice(0, a)) + '<mark>' + esc(name.slice(a, b)) + '</mark>' + esc(name.slice(b));
}

function render() {
  const nq = norm(q.value);
  clr.classList.toggle('show', q.value.length > 0);
  const list = ROWS.filter(r => (!dept || r.d === dept) && (!nq || r.k.includes(nq)));
  let html = '';
  for (const r of list) {
    html += `<tr><td class="nm">${highlight(r.n, nq)}</td><td class="d">${esc(r.d)}</td></tr>`;
  }
  tb.innerHTML = html;
  empty.style.display = list.length ? 'none' : 'block';
}

q.addEventListener('input', render);
clr.addEventListener('click', () => { q.value = ''; q.focus(); render(); });

render();
